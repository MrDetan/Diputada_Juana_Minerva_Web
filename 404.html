<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Dip. Juana Minerva Vázquez González</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta http-equiv="refresh" content="5; url=index.html">
    <style>
        .error-page-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            background: var(--bg-body, #FAF8F5);
        }
        .error-card {
            background: #FFFFFF;
            border: 1px solid #E7E5E0;
            border-radius: 20px;
            padding: 48px 32px;
            max-width: 540px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.08);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 900;
            color: #8C1833;
            line-height: 1;
            margin-bottom: 12px;
            font-family: 'Playfair Display', serif;
        }
        .error-title {
            font-size: 1.5rem;
            color: #1C1917;
            margin-bottom: 16px;
        }
        .error-desc {
            color: #57534E;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="error-page-container">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">Página no localizada</h1>
            <p class="error-desc">El enlace que buscas no existe o ha sido reubicado. Serás redirigido al portal oficial en unos segundos.</p>
            <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
